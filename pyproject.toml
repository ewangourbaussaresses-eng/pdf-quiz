[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-quiz"
version = "1.0.0"
description = "Transforme un PDF de cours en flashcards interactives et en QCM (web + CLI)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pdf", "flashcards", "quiz", "edtech", "anki", "llm"]
classifiers = [
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdf-quiz = "pdf_quiz.cli:main"

[tool.setuptools]
packages = ["pdf_quiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
